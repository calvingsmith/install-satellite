---
# Foreman Subnet must match the network used for provisioning and the IdM/forward DNS
# design. Set foreman_subnet_dhcp_proxy to satellite_smart_proxy_name only when ISC
# DHCP (dhcpd) is installed and managed by foreman-proxy. Defaults to "" (no DHCP proxy).

- name: Require DHCP range string for Foreman pool (two space-separated IPs)
  ansible.builtin.assert:
    that:
      - dhcp_range is defined
      - dhcp_range.split(' ') | length >= 2
    fail_msg: >-
      dhcp_range must match satellite-installer --foreman-proxy-dhcp-range (e.g. "192.168.122.100 192.168.122.200").

- name: Derive DHCP pool bounds from dhcp_range
  ansible.builtin.set_fact:
    foreman_subnet_from_ip: "{{ dhcp_range.split(' ')[0] }}"
    foreman_subnet_to_ip: "{{ dhcp_range.split(' ')[1] }}"

- name: Ensure Foreman subnet exists
  redhat.satellite.subnet:
    username: "{{ satellite_username }}"
    password: "{{ satellite_password }}"
    server_url: "{{ satellite_url }}"
    validate_certs: "{{ satellite_validate_certs }}"
    state: present
    name: "{{ foreman_subnet_name }}"
    network: "{{ foreman_subnet_network }}"
    cidr: "{{ subnet_cidr | int }}"
    gateway: "{{ gateway_ip }}"
    dns_primary: "{{ idm_server_ip }}"
    domains:
      - "{{ ipaserver_domain }}"
    organizations:
      - "{{ satellite_organization }}"
    locations:
      - "{{ satellite_location }}"
    boot_mode: DHCP
    ipam: "{{ foreman_subnet_ipam | default('DHCP') }}"
    from_ip: "{{ foreman_subnet_from_ip }}"
    to_ip: "{{ foreman_subnet_to_ip }}"
    dhcp_proxy: "{{ foreman_subnet_dhcp_proxy | default(satellite_smart_proxy_name) }}"
    tftp_proxy: "{{ satellite_smart_proxy_name }}"
    httpboot_proxy: "{{ satellite_smart_proxy_name }}"
    dns_proxy: "{{ satellite_smart_proxy_name }}"

- name: Look up subnet to apply kernel_opts (not exposed by satellite.subnet module)
  ansible.builtin.uri:
    url: "{{ satellite_url }}/api/v2/subnets?search=name={{ foreman_subnet_name | urlencode }}"
    url_username: "{{ satellite_username }}"
    url_password: "{{ satellite_password }}"
    force_basic_auth: true
    validate_certs: "{{ satellite_validate_certs }}"
    return_content: true
  register: _subnet_role_lookup
  delegate_to: localhost

- name: Set kernel_opts on Foreman subnet via API
  ansible.builtin.uri:
    url: "{{ satellite_url }}/api/v2/subnets/{{ _subnet_role_lookup.json.results[0].id }}"
    method: PUT
    url_username: "{{ satellite_username }}"
    url_password: "{{ satellite_password }}"
    force_basic_auth: true
    validate_certs: "{{ satellite_validate_certs }}"
    body_format: json
    body:
      subnet:
        kernel_opts: "{{ foreman_subnet_kernel_opts | default('inst.noverifyssl') }}"
    status_code: [200, 201]
  when: (_subnet_role_lookup.json.results | default([]) | length) > 0
  delegate_to: localhost
