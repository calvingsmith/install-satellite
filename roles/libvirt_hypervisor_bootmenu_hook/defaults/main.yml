---
# Installed on the libvirt hypervisor (not Satellite). Requires libvirt >= 6.5 (qemu.d hooks).
libvirt_bootmenu_hook_script_path: /etc/libvirt/hooks/qemu.d/50-bootmenu
libvirt_bootmenu_hook_libvirtd_service: libvirtd
# HTTP boot URI for NVRAM BootNext pre-seeding.
# When set, the role creates /etc/libvirt/hooks/nvram-http-boot-template.qcow2
# (a copy of OVMF_VARS_4M.qcow2 with BootNext pointing at this URI) and the
# prepare/begin hook redirects the <nvram template='...'> attribute to it when
# the NVRAM instance does not yet exist (fresh / re-provisioned VM).
# Set to empty string to disable NVRAM preseed.
libvirt_bootmenu_http_uri: ""

# Foreman build_exited webhook receiver (see tasks/build_webhook.yml).
libvirt_prefer_disk_boot_webhook_enabled: true
libvirt_prefer_disk_boot_webhook_script_path: /usr/local/sbin/prefer_disk_boot_webhook.py
libvirt_prefer_disk_boot_webhook_bind: "{{ gateway_ip | default('192.168.122.1') }}"
libvirt_prefer_disk_boot_webhook_port: 8765
libvirt_prefer_disk_boot_webhook_ready_dir: /run/provision-demo
libvirt_prefer_disk_boot_webhook_grace_seconds: 30
libvirt_prefer_disk_boot_webhook_retry_interval: 15
libvirt_prefer_disk_boot_webhook_max_retries: 20
# Optional shared secret; when set, Satellite webhook must send header X-Provision-Demo-Secret.
libvirt_prefer_disk_boot_webhook_secret: ""
