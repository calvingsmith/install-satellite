---
# Host group references CV/LCE, activation key, domain, subnet, realm, compute_resource, and compute_profile (laptop.lab.yml).
# ansible_roles requires the foreman_ansible plugin and the role imported under Configure → Ansible → Roles.

- name: Ensure rhel9-server host group uses activation key
  redhat.satellite.hostgroup:
    username: "{{ satellite_username }}"
    password: "{{ satellite_password }}"
    server_url: "{{ satellite_url }}"
    validate_certs: "{{ satellite_validate_certs }}"
    state: present
    organization: "{{ satellite_organization }}"
    name: "{{ rhel9_hostgroup_name }}"
    locations:
      - "{{ satellite_location }}"
    compute_resource: "{{ libvirt_compute_resource_name }}"
    compute_profile: "{{ libvirt_compute_profile_name }}"
    architecture: "{{ rhel9_hostgroup_architecture }}"
    operatingsystem: "{{ rhel9_hostgroup_operatingsystem }}"
    ptable: "{{ rhel9_hostgroup_ptable }}"
    content_source: "{{ rhel9_hostgroup_content_source | default(satellite_smart_proxy_name) }}"
    openscap_proxy: "{{ rhel9_hostgroup_openscap_proxy | default(satellite_smart_proxy_name) }}"
    domain: "{{ ipaserver_domain }}"
    subnet: "{{ foreman_subnet_name }}"
    realm: "{{ ipaserver_realm }}"
    lifecycle_environment: "{{ rhel9_activation_key_lifecycle_environment }}"
    content_view: "{{ rhel9_activation_key_content_view }}"
    activation_keys: "{{ rhel9_activation_key_name }}"
    ansible_roles: "{{ rhel9_hostgroup_ansible_roles }}"
    parameters:
      - name: kernel_options
        parameter_type: string
        value: inst.noverifyssl
      # tune-grub-params: force GRUB to select the EFI HTTP entry by name rather than relying on
      # auto-detection (template checks subnet.httpboot.httpboot_http_port). This guarantees the
      # HTTP kernel/initrd path even if the HTTPBoot proxy feature is temporarily misconfigured.
      - name: default_grub_install_entry
        parameter_type: string
        value: efi_http
      # loader_timeout: GRUB countdown before auto-boot (seconds). 2s is the template default; set
      # here explicitly so it is visible and can be overridden per host without editing the template.
      - name: loader_timeout
        parameter_type: integer
        value: 2
      # redhat.rhel_system_roles.firewall role variables — inherited by all child host groups.
      # firewall_default_zone: the zone Satellite REX sets as default on managed hosts.
      - name: firewall_default_zone
        parameter_type: string
        value: "{{ rhel9_firewall_default_zone }}"
      # firewall: list of rule specs consumed by redhat.rhel_system_roles.firewall.
      # Enables SSH and explicitly disables the echo-request ICMP block (allows ping) in the
      # internal zone.  Child host groups override individual entries by adding parameters of
      # the same name — they do NOT need to repeat these defaults.
      - name: firewall
        parameter_type: array
        value: "{{ rhel9_firewall_rules }}"
