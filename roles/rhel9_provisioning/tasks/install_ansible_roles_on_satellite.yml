---
# Install the Insights *role* RPM on Satellite, then import into Foreman (hammer) so the host group can assign ansible_roles.

- name: Install Insights client Ansible role RPM on Satellite
  ansible.builtin.dnf:
    name: "{{ rhel9_insights_ansible_rpm }}"
    state: present

- name: Stat Insights Ansible role directory from RPM
  ansible.builtin.stat:
    path: "{{ rhel9_insights_ansible_role_path }}"
  register: rhel9_insights_role_path_stat

- name: Assert Insights role path exists after RPM install
  ansible.builtin.assert:
    that:
      - rhel9_insights_role_path_stat.stat.exists
      - rhel9_insights_role_path_stat.stat.isdir
    fail_msg: >-
      Expected role directory {{ rhel9_insights_ansible_role_path }} missing after installing {{ rhel9_insights_ansible_rpm }}.
      Override rhel9_insights_ansible_role_path (see rpm -ql {{ rhel9_insights_ansible_rpm }}).

- name: Get Smart Proxy ID for Ansible role import
  ansible.builtin.command:
    argv:
      - hammer
      - proxy
      - info
      - "--name"
      - "{{ satellite_smart_proxy_name }}"
      - "--output"
      - json

  register: rhel9_insights_proxy_info
  changed_when: false

- name: Set Smart Proxy ID for hammer ansible import
  vars:
    _proxy: "{{ rhel9_insights_proxy_info.stdout | from_json }}"
  ansible.builtin.set_fact:
    satellite_ansible_smart_proxy_id: "{{ _proxy.id | default(_proxy.Id) }}"

- name: Assert Smart Proxy ID was resolved
  ansible.builtin.assert:
    that:
      - satellite_ansible_smart_proxy_id is defined
      - satellite_ansible_smart_proxy_id | string | length > 0
    fail_msg: >-
      Could not read id from `hammer proxy info --name {{ satellite_smart_proxy_name }} --output json`.

- name: Import Insights Ansible role(s) into Satellite from Smart Proxy
  ansible.builtin.command:
    argv:
      - hammer
      - ansible
      - roles
      - import
      - "--proxy-id"
      - "{{ satellite_ansible_smart_proxy_id | string }}"
      - "--role-names"
      - "{{ rhel9_insights_hammer_import_role_names }}"
  register: rhel9_insights_hammer_import
  changed_when: rhel9_insights_hammer_import.rc == 0
  failed_when: rhel9_insights_hammer_import.rc != 0
