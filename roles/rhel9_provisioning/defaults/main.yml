---
# Host group that receives the activation key (create/update via API).
# Domain, subnet, and realm on the host group use ipaserver_domain, foreman_subnet_name,
# and ipaserver_realm (see laptop.lab.yml; post-install loads it via vars_files).
rhel9_hostgroup_name: "rhel9-server"
rhel9_hostgroup_architecture: "x86_64"
rhel9_hostgroup_ptable: "Kickstart default"
# Foreman OS title (Hosts → Operating Systems, or hammer os list); not the shorthand "RHEL 9.7".
rhel9_hostgroup_operatingsystem: "RedHat 9.7"
# Content source and OpenSCAP proxy default to integrated Satellite (hammer proxy list).
# Override per host_vars if needed, e.g. a Capsule FQDN.
# rhel9_hostgroup_content_source: "satellite.example.com"
# rhel9_hostgroup_openscap_proxy: "satellite.example.com"

# Ansible roles on the host group (foreman_ansible; role must be imported in Satellite).
# Order matters: firewall is applied first so the network is properly configured before other roles run.
rhel9_hostgroup_ansible_roles:
  - "redhat.rhel_system_roles.firewall"
  - "RedHatInsights.insights-client"

# Insights Ansible *role* RPM + hammer import (install_ansible_roles_on_satellite.yml).
rhel9_insights_ansible_rpm: "ansiblerole-insights-client"
# Role tree installed by the RPM (verify with rpm -ql ansiblerole-insights-client).
rhel9_insights_ansible_role_path: "/usr/share/ansible/roles/RedHatInsights.insights-client"
# Explicit: only import the Insights role here; firewall role is imported by install_firewall_role_on_satellite.yml.
rhel9_insights_hammer_import_role_names: "RedHatInsights.insights-client"

# rhel-system-roles firewall role (install_firewall_role_on_satellite.yml + hostgroup.yml).
rhel9_firewall_role_rpm: "rhel-system-roles"
# Collection path after rpm install (verify with: rpm -ql rhel-system-roles | grep firewall | head -1).
rhel9_firewall_role_path: "/usr/share/ansible/collections/ansible_collections/redhat/rhel_system_roles/roles/firewall"
rhel9_firewall_role_name: "redhat.rhel_system_roles.firewall"
# Default firewall zone applied by the role (firewall_default_zone role variable).
rhel9_firewall_default_zone: "internal"
# Firewall rules applied by the role (firewall role variable — a list of rule specifications).
# internal zone: SSH + ensure ping (ICMP echo-request is not blocked).
rhel9_firewall_rules:
  - zone: internal
    service:
      - ssh
    permanent: true
    state: enabled
  - zone: internal
    icmp_block:
      - echo-request
    permanent: true
    state: disabled

# Activation key for hosts that need standard RHEL 9 yum content (BaseOS + AppStream).
rhel9_activation_key_name: "rhel9-standard"
rhel9_activation_key_description: "RHEL 9 BaseOS and AppStream for provisioned content hosts"

# Must match repos published into this CV/LCE (default all-library content).
rhel9_activation_key_lifecycle_environment: "Library"
rhel9_activation_key_content_view: "Default Organization View"

# Repository content_label values (hammer repository list --fields label,name).
# RHEL 10 entries keep RHEL 9 hosts from picking up 10.x repos when both are in the CV.
rhel9_activation_key_content_overrides:
  - label: rhel-9-for-x86_64-baseos-rpms
    override: enabled
  - label: rhel-9-for-x86_64-appstream-rpms
    override: enabled
  - label: rhel-10-for-x86_64-baseos-rpms
    override: disabled
  - label: rhel-10-for-x86_64-appstream-rpms
    override: disabled
