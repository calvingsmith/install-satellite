---
# Lab demo: apply a reversible misconfiguration that IOP advisor rules can flag after inventory runs.
- name: Validate recommendation demo method
  ansible.builtin.assert:
    that:
      - lightspeed_demo_recommendation_method in ['firewalld', 'sysctl_ip_forward']
    fail_msg: "lightspeed_demo_recommendation_method must be firewalld or sysctl_ip_forward."

- name: Apply Lightspeed recommendation demo (firewalld inactive)
  when:
    - lightspeed_demo_recommendation_state == 'present'
    - lightspeed_demo_recommendation_method == 'firewalld'
  block:
    - name: Ensure firewalld is stopped and disabled (demo only)
      ansible.builtin.service:
        name: firewalld
        state: stopped
        enabled: false

- name: Remove Lightspeed recommendation demo (firewalld)
  when:
    - lightspeed_demo_recommendation_state == 'absent'
    - lightspeed_demo_recommendation_method == 'firewalld'
  block:
    - name: Re-enable firewalld after demo
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

- name: Apply Lightspeed recommendation demo (sysctl ip_forward)
  when:
    - lightspeed_demo_recommendation_state == 'present'
    - lightspeed_demo_recommendation_method == 'sysctl_ip_forward'
  ansible.builtin.copy:
    dest: /etc/sysctl.d/50-lightspeed-demo-ip-forward.conf
    mode: "0644"
    content: |
      # Lightspeed IOP demo — remove after testing (role lightspeed_demo_recommendation, state=absent)
      net.ipv4.ip_forward = 1

- name: Load sysctl demo settings
  when:
    - lightspeed_demo_recommendation_state == 'present'
    - lightspeed_demo_recommendation_method == 'sysctl_ip_forward'
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Remove sysctl demo file
  when:
    - lightspeed_demo_recommendation_state == 'absent'
    - lightspeed_demo_recommendation_method == 'sysctl_ip_forward'
  ansible.builtin.file:
    path: /etc/sysctl.d/50-lightspeed-demo-ip-forward.conf
    state: absent

- name: Reload sysctl after removing demo file
  when:
    - lightspeed_demo_recommendation_state == 'absent'
    - lightspeed_demo_recommendation_method == 'sysctl_ip_forward'
  ansible.builtin.command: sysctl --system
  changed_when: true
