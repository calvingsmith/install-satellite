---
# ForemanWebhooks::DeliverWebhookJob runs in the foreman_rails SELinux domain. Without
# foreman_rails_can_connect_all, outbound HTTP to the hypervisor webhook port is denied.

- name: Allow Foreman Rails workers to deliver webhooks over HTTP
  ansible.posix.seboolean:
    name: foreman_rails_can_connect_all
    state: true
    persistent: true
  delegate_to: "{{ lightspeed_demo_satellite_host }}"
  become: true
  vars:
    ansible_connection: ssh
  run_once: true # noqa: run-once[task]
