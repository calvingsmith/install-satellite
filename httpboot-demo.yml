---
# Publish the SOE PXEGrub2 template (EFI HTTP default, 10s loader timeout) to Satellite,
# associate it with the RHEL 9 operating system, and set it as the default PXEGrub2 template.
#
# Prerequisites: ansible-galaxy collection install redhat.satellite (and Python requests on the controller).
#
# Variables (aligned with post-install.yml):
#   - ~/vault/satellite.yml — satellite_password, satellite_initial_organization, satellite_initial_location, …
#   - ~/vault/secrets.yml — optional extra secrets if your layout uses them
#   - laptop.lab.yml — lab network defaults (repo root)
#   - host_vars/<satellite>/ — applied automatically when the play targets that host (see below)
#
# The play uses the Satellite host name so Ansible loads host_vars (e.g. satellite_url, org/location) without
# listing them in vars_files. Use an inventory that contains the Satellite FQDN (see inventory in this repo).
#
# Run from the repository root:
#   ansible-playbook -i inventory httpboot-demo.yml
#
# Override any value with -e, or change the play host (e.g. duplicate host_vars for another FQDN).
#
# The playbook associates the uploaded template with the RHEL 9 operating system and sets it as the
# default PXEGrub2 template for that OS. Satellite has one OS per minor (9.5, 9.6, 9.7, …); the default
# search pins minor=7 to match roles/rhel9_provisioning (RHEL 9.7). Override if your lab uses another minor:
#   -e satellite_soe_templates_rhel9_minor=6
# Or pass a full Foreman search:
#   -e 'satellite_soe_templates_os_search=name = "RedHat" and major = 9 and minor = "7"'
#
# If the API returns no existing template associations (unusual), set
# satellite_soe_templates_existing_provisioning_templates to the full list of template names to preserve.
#
# HTTPS / TLS (Satellite API):
#   If the play fails with CERTIFICATE_VERIFY_FAILED or "Basic Constraints of CA cert not marked critical",
#   Python/OpenSSL on the controller is rejecting Satellite's chain (common with IdM or internal CAs).
#   OpenSSL 3 is strict about CA extensions; a PEM alone may not fix it if the CA cert is old or mis-issued.
#   Options:
#     - This repo: place a PEM at ./ca.crt (e.g. scp idm:/etc/ipa/ca.crt). The play uses it automatically
#       as satellite_ca_path when the file exists and you have not set satellite_ca_path elsewhere.
#     - Still failing: use lab-only  -e satellite_validate_certs=false  (disables verification).
#     - Production: update/reissue CA or install the CA into the system trust store on the controller;
#       or pass  -e satellite_ca_path=/path/to/ca.pem  explicitly.

- name: Publish SOE Kickstart Default PXEGrub2 (HTTP boot demo)
  hosts: satellite.laptop.lab
  connection: local
  gather_facts: false
  vars_files:
    - "~/vault/satellite.yml"
    - "~/vault/secrets.yml"
    - "{{ playbook_dir }}/laptop.lab.yml"
  vars:
    # Upload only the PXEGrub2 template and link it to the RHEL 9 OS.
    # The full SOE template set is uploaded by lightspeed-demo-client.yml at provision time.
    satellite_soe_templates_list:
      - name: SOE Kickstart Default PXEGrub2
        kind: PXEGrub2
        file_name: "{{ playbook_dir }}/templates/prov_template_soe_kickstart_default_pxegrub2.j2"
    satellite_soe_templates_link_os: true

  module_defaults:
    group/redhat.satellite.satellite:
      username: "{{ satellite_username | default('admin') }}"
      password: "{{ satellite_password }}"
      server_url: "{{ satellite_url }}"
      validate_certs: "{{ satellite_validate_certs | default(true) }}"
      ca_path: "{{ satellite_ca_path | default(omit) }}"

  pre_tasks:
    - name: Detect CA certificate for Satellite API
      ansible.builtin.import_role:
        name: satellite_soe_templates
        tasks_from: detect_ca

    - name: Ensure provisioning template file exists on the controller
      ansible.builtin.stat:
        path: "{{ (satellite_soe_templates_list | first).file_name }}"
      register: httpboot_demo_template_stat

    - name: Fail if template file is missing
      ansible.builtin.assert:
        that:
          - httpboot_demo_template_stat.stat.exists
        fail_msg: "Missing {{ (satellite_soe_templates_list | first).file_name }} (clone or create the SOE PXEGrub2 template first)."

  roles:
    - role: satellite_soe_templates

- name: Provision HTTP-boot test VM via Satellite — test-boot.laptop.lab
  hosts: satellite_group
  connection: local
  gather_facts: false
  tags:
    - httpboot_provision
  vars_files:
    - "~/vault/satellite.yml"
    - "~/vault/secrets.yml"
    - "{{ playbook_dir }}/laptop.lab.yml"
  vars:
    lightspeed_demo_vm_fqdn: test-boot.laptop.lab

  module_defaults:
    group/redhat.satellite.satellite:
      username: "{{ satellite_username | default('admin') }}"
      password: "{{ satellite_password }}"
      server_url: "{{ satellite_url }}"
      validate_certs: "{{ satellite_validate_certs | default(true) }}"
      ca_path: "{{ satellite_ca_path | default(omit) }}"

  pre_tasks:
    - name: Skip provision play when disabled
      when: not (provision_demo_vm | default(true) | bool)
      ansible.builtin.meta: end_play

    - name: Detect CA certificate for Satellite API
      ansible.builtin.import_role:
        name: satellite_soe_templates
        tasks_from: detect_ca

    - name: Require root_password in vault for managed host kickstart (root_pass)
      ansible.builtin.assert:
        that:
          - root_password is defined
          - root_password | length > 0
        fail_msg: >-
          Define root_password in ~/vault/satellite.yml so Satellite can inject the kickstart root password.

    - name: Ensure Foreman subnet has correct DHCP proxy, IPAM, and kernel options
      block:
        - name: Look up Foreman subnet
          ansible.builtin.uri:
            url: "{{ satellite_url | regex_replace('/$', '') }}/api/v2/subnets?search=name={{ foreman_subnet_name | urlencode }}"
            url_username: "{{ satellite_username | default('admin') }}"
            url_password: "{{ satellite_password }}"
            force_basic_auth: true
            validate_certs: "{{ satellite_validate_certs | default(true) }}"
            ca_path: "{{ satellite_ca_path | default(omit) }}"
            return_content: true
          register: _subnet_lookup
          delegate_to: localhost
          run_once: true # noqa: run-once[task]

        - name: Look up Satellite smart proxy ID for DHCP
          vars:
            _proxy_name: "{{ satellite_smart_proxy_name | default('satellite.laptop.lab') }}"
          ansible.builtin.uri:
            url: "{{ satellite_url | regex_replace('/$', '') }}/api/v2/smart_proxies?search=name%3D{{ _proxy_name | urlencode }}"
            url_username: "{{ satellite_username | default('admin') }}"
            url_password: "{{ satellite_password }}"
            force_basic_auth: true
            validate_certs: "{{ satellite_validate_certs | default(true) }}"
            ca_path: "{{ satellite_ca_path | default(omit) }}"
            return_content: true
          register: _proxy_lookup
          delegate_to: localhost
          run_once: true # noqa: run-once[task]

        - name: PUT subnet with correct DHCP, HTTPBoot, TFTP proxies and kernel options
          ansible.builtin.uri:
            url: "{{ satellite_url | regex_replace('/$', '') }}/api/v2/subnets/{{ _subnet_lookup.json.results[0].id }}"
            method: PUT
            url_username: "{{ satellite_username | default('admin') }}"
            url_password: "{{ satellite_password }}"
            force_basic_auth: true
            validate_certs: "{{ satellite_validate_certs | default(true) }}"
            ca_path: "{{ satellite_ca_path | default(omit) }}"
            body_format: json
            body:
              subnet:
                dhcp_id: "{{ _proxy_lookup.json.results[0].id }}"
                httpboot_id: "{{ _proxy_lookup.json.results[0].id }}"
                tftp_id: "{{ _proxy_lookup.json.results[0].id }}"
                ipam: "DHCP"
                kernel_opts: "inst.noverifyssl"
            status_code: [200, 201]
          register: _subnet_update_result
          delegate_to: localhost
          run_once: true # noqa: run-once[task]
          when: >-
            (_subnet_lookup.json.results | default([]) | length) > 0 and
            (_proxy_lookup.json.results | default([]) | length) > 0

  roles:
    - role: provision_demo
