---
# Publish the SOE PXEGrub2 template (EFI HTTP default, 10s loader timeout) to Satellite.
#
# Prerequisites: ansible-galaxy collection install redhat.satellite (and Python requests on the controller).
#
# Variables (aligned with post-install.yml):
#   - ~/vault/satellite.yml — satellite_password, satellite_initial_organization, satellite_initial_location, …
#   - ~/vault/secrets.yml — optional extra secrets if your layout uses them
#   - laptop.lab.yml — lab network defaults (repo root)
#   - host_vars/<satellite>/ — applied automatically when the play targets that host (see below)
#
# The play uses the Satellite host name so Ansible loads host_vars (e.g. satellite_url, org/location) without
# listing them in vars_files. Use an inventory that contains the Satellite FQDN (see inventory in this repo).
#
# Run from the repository root:
#   ansible-playbook -i inventory httpboot-demo.yml
#
# Override any value with -e, or change the play host (e.g. duplicate host_vars for another FQDN).
#
# The playbook also associates that template with the RHEL 9 operating system and sets it as the
# default PXEGrub2 template for that OS. Satellite has one OS per minor (9.5, 9.6, 9.7, …); the default
# search pins minor=7 to match roles/rhel9_provisioning (RHEL 9.7). Override if your lab uses another minor:
#   -e httpboot_demo_rhel9_minor=6
# Or pass a full Foreman search:
#   -e 'httpboot_demo_os_search=name = "RedHat" and major = 9 and minor = "7"'
#
# If the API returns no existing template associations (unusual), set
# httpboot_demo_existing_provisioning_templates to the full list of template names to preserve.
#
# HTTPS / TLS (Satellite API):
#   If the play fails with CERTIFICATE_VERIFY_FAILED or "Basic Constraints of CA cert not marked critical",
#   Python/OpenSSL on the controller is rejecting Satellite's chain (common with IdM or internal CAs).
#   OpenSSL 3 is strict about CA extensions; a PEM alone may not fix it if the CA cert is old or mis-issued.
#   Options:
#     - This repo: place a PEM at ./ca.crt (e.g. scp idm:/etc/ipa/ca.crt). The play uses it automatically
#       as satellite_ca_path when the file exists and you have not set satellite_ca_path elsewhere.
#     - Still failing: use lab-only  -e satellite_validate_certs=false  (disables verification).
#     - Production: update/reissue CA or install the CA into the system trust store on the controller;
#       or pass  -e satellite_ca_path=/path/to/ca.pem  explicitly.

- name: Publish SOE Kickstart Default PXEGrub2 (HTTP boot demo)
  hosts: satellite.laptop.lab
  connection: local
  gather_facts: false
  vars_files:
    - "~/vault/satellite.yml"
    - "~/vault/secrets.yml"
    - "{{ playbook_dir }}/laptop.lab.yml"
  vars:
    # Do not set satellite_username / satellite_validate_certs here with |default(self)—that is circular and
    # causes infinite templating recursion. Defaults are applied on each module below.
    httpboot_demo_template_path: "{{ playbook_dir }}/templates/prov_template_soe_kickstart_default_pxegrub2.j2"
    httpboot_demo_pxegrub2_name: SOE Kickstart Default PXEGrub2

  pre_tasks:
    - name: Ensure provisioning template file exists on the controller
      ansible.builtin.stat:
        path: "{{ httpboot_demo_template_path }}"
      register: httpboot_demo_template_stat

    - name: Fail if template file is missing
      ansible.builtin.assert:
        that:
          - httpboot_demo_template_stat.stat.exists
        fail_msg: "Missing {{ httpboot_demo_template_path }} (clone or create the SOE PXEGrub2 template first)."

    - name: Stat optional repo-root CA for Satellite API (./ca.crt)
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/ca.crt"
      register: httpboot_demo_ca_crt_stat

    - name: Default satellite_ca_path to repo ca.crt when file exists
      ansible.builtin.set_fact:
        satellite_ca_path: "{{ playbook_dir }}/ca.crt"
      when:
        - satellite_ca_path is not defined
        - httpboot_demo_ca_crt_stat.stat.exists

  tasks:
    - name: Ensure SOE Kickstart Default PXEGrub2 provisioning template in Satellite
      redhat.satellite.provisioning_template:
        username: "{{ satellite_username | default('admin') }}"
        password: "{{ satellite_password }}"
        server_url: "{{ satellite_url }}"
        validate_certs: "{{ satellite_validate_certs | default(true) }}"
        ca_path: "{{ satellite_ca_path | default(omit) }}"
        state: present
        name: SOE Kickstart Default PXEGrub2
        kind: PXEGrub2
        file_name: "{{ httpboot_demo_template_path }}"
        organizations:
          - "{{ satellite_organization }}"
        locations:
          - "{{ satellite_location }}"

    - name: Resolve Foreman search string for RHEL 9 OS
      ansible.builtin.set_fact:
        httpboot_demo_os_search_effective: >-
          {{
            httpboot_demo_os_search
            if httpboot_demo_os_search is defined
            else (
              'name = "RedHat" and major = 9 and minor = "'
              ~ (httpboot_demo_rhel9_minor | default('7') | string)
              ~ '"'
            )
          }}

    - name: Look up RHEL 9 operating system (full API record)
      redhat.satellite.resource_info:
        username: "{{ satellite_username | default('admin') }}"
        password: "{{ satellite_password }}"
        server_url: "{{ satellite_url }}"
        validate_certs: "{{ satellite_validate_certs | default(true) }}"
        ca_path: "{{ satellite_ca_path | default(omit) }}"
        resource: operatingsystems
        search: "{{ httpboot_demo_os_search_effective }}"
        full_details: true
      register: httpboot_rhel9_os

    - name: Require exactly one operating system for httpboot_demo_os_search_effective
      ansible.builtin.assert:
        that:
          - httpboot_rhel9_os.resources | length == 1
        fail_msg: >-
          Expected one OS for search [{{ httpboot_demo_os_search_effective }}], got {{ httpboot_rhel9_os.resources | length }}.
          Set -e httpboot_demo_rhel9_minor=<n> to match your Satellite OS minor, or pass a full -e httpboot_demo_os_search=...
          that returns exactly one operatingsystem (hammer os list --search 'major = 9').

    - name: Cache OS entity and base provisioning template names
      ansible.builtin.set_fact:
        httpboot_demo_os_entity: "{{ httpboot_rhel9_os.resources[0] }}"
        httpboot_demo_base_template_names: >-
          {{
            httpboot_demo_existing_provisioning_templates
            if httpboot_demo_existing_provisioning_templates is defined
            else (httpboot_rhel9_os.resources[0].provisioning_templates | default([], true) | map(attribute='name') | list)
          }}

    - name: Merge SOE PXEGrub2 into provisioning template list
      ansible.builtin.set_fact:
        httpboot_demo_merged_template_names: "{{ httpboot_demo_base_template_names | union([httpboot_demo_pxegrub2_name]) | unique | list }}"

    - name: Refuse to replace OS templates with only the SOE entry (would drop other associations)
      when:
        - httpboot_demo_existing_provisioning_templates is not defined
        - httpboot_demo_base_template_names | length == 0
      ansible.builtin.fail:
        msg: >-
          No provisioning_templates linked on this OS and httpboot_demo_existing_provisioning_templates was not set.
          Pass the full list of template names to keep, e.g.
          -e '{"httpboot_demo_existing_provisioning_templates":["Kickstart default","Kickstart default finish",...]}'

    - name: Associate merged provisioning templates with the RHEL 9 operating system
      redhat.satellite.operatingsystem:
        username: "{{ satellite_username | default('admin') }}"
        password: "{{ satellite_password }}"
        server_url: "{{ satellite_url }}"
        validate_certs: "{{ satellite_validate_certs | default(true) }}"
        ca_path: "{{ satellite_ca_path | default(omit) }}"
        state: present
        name: "{{ httpboot_demo_os_entity.name }}"
        major: "{{ httpboot_demo_os_entity.major }}"
        minor: "{{ httpboot_demo_os_entity.minor }}"
        os_family: "{{ httpboot_demo_os_entity.family }}"
        provisioning_templates: "{{ httpboot_demo_merged_template_names }}"

    - name: Set default PXEGrub2 template for RHEL 9 to SOE Kickstart Default PXEGrub2
      redhat.satellite.os_default_template:
        username: "{{ satellite_username | default('admin') }}"
        password: "{{ satellite_password }}"
        server_url: "{{ satellite_url }}"
        validate_certs: "{{ satellite_validate_certs | default(true) }}"
        ca_path: "{{ satellite_ca_path | default(omit) }}"
        state: present
        operatingsystem: "{{ httpboot_demo_os_entity.title }}"
        template_kind: PXEGrub2
        provisioning_template: "{{ httpboot_demo_pxegrub2_name }}"

    - name: Show provisioning template result summary
      ansible.builtin.debug:
        msg: >-
          Template uploaded, linked to OS [{{ httpboot_demo_os_entity.title }}], and set as default PXEGrub2.
          Rebuild discovery or provisioned hosts as needed for UEFI HTTP boot.
