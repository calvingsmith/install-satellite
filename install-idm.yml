---
- name: Phase 1 - Provision libvirt Virtual Machine
  hosts: localhost
  connection: local
  become: true
  tags:
    - provision

  vars_files:
    - ~/vault/secrets.yml  # This file should contain the sensitive variables like root_password
    - laptop.lab.yml       # This file should contain the static IP and other non-sensitive variables
    - host_vars/idm.laptop.lab.yml   # This file should contain the VM specs and hostname for IdM

  vars:
    vm_name: "idm-server"                 # Using root for the initial bootstrap
    base_image_path: "/home/casmith/VirtualMachines/images/rhel-9.7-x86_64-kvm.qcow2" # Point this to your RHEL qcow2 image
    vm_disk_path: "/home/casmith/VirtualMachines/{{ vm_name }}.qcow2"                 # Using root for the initial bootstrap

  tasks:
    - name: Check if the VM disk already exists
      ansible.builtin.stat:
        path: "{{ vm_disk_path }}"
      register: vm_disk_stat

    - name: End play if VM disk already exists
      ansible.builtin.meta: end_host
      when: vm_disk_stat.stat.exists

    - name: Copy base RHEL image to new VM disk
      ansible.builtin.copy:
        src: "{{ base_image_path }}"
        dest: "{{ vm_disk_path }}"
        remote_src: true
        force: false
        mode: preserve

    - name: Resize the VM disk
      ansible.builtin.command: "qemu-img resize {{ vm_disk_path }} {{ vm_disk_size }}"
      register: resize_result
      changed_when: resize_result.rc == 0

    - name: Template the network configuration for static IP
      ansible.builtin.template:
        src: eth0.conf.j2
        dest: /tmp/eth0.conf
        mode: preserve

    - name: Use virt-customize to set IP address, grow partition and inject SSH key
      ansible.builtin.command: >
        virt-customize -a {{ vm_disk_path }} \
        --root-password password:{{ root_password }} \
        --hostname "{{ hostname }}" \
        --upload /tmp/eth0.conf:/etc/NetworkManager/system-connections/Wired\ Connection\ 1.nmconnection \
        --chmod 0600:/etc/NetworkManager/system-connections/Wired\ Connection\ 1.nmconnection \
        --run-command "xfs_growfs /dev/sda4" \
        --ssh-inject root:file://{{ ssh_pub_key_file }}
      register: customize_result
      changed_when: customize_result.rc == 0

    - name: Define and start the IdM VM
      community.libvirt.virt:
        command: define
        xml: "{{ lookup('template', 'vm_template.xml.j2') }}" # See note below about this template

    - name: Start the Virtual Machine
      community.libvirt.virt:
        name: "{{ vm_name }}"
        state: running

    - name: Wait for SSH to come up
      ansible.builtin.wait_for:
        host: "{{ static_ip }}"
        port: 22
        delay: 15
        timeout: 300
        state: started

    # Delete /tmp/eth0.conf after use
    # - name: Clean up temporary network config file
    #   ansible.builtin.file:
    #     path: /tmp/eth0.conf
    #     state: absent

- name: Phase 2 - Install Red Hat IdM Server on RHEL 9
  hosts: idm_server
  become: true
  tags:
    - install_idm

  # Load the separate passwords file
  vars_files:
    - ~/vault/secrets.yml  # This file should contain the sensitive variables like ipadm_password and ipaadmin_password
    - host_vars/idm.laptop.lab.yml   # This file should contain the VM specs and hostname for IdM
    - laptop.lab.yml       # This file should contain the static IP and other non-sensitive variables

  vars:

    # --- DNS Settings ---
    ipaserver_setup_dns: "true"
    # ipaserver_no_forwarders: true
    # ipaserver_auto_forwarders: false
    ipaserver_forwarders: ["192.168.122.1"]
    # Reverse zones for ipa-server-install (must include 122.168.192.in-addr.arpa for 192.168.122.0/24 — libvirt default net / Foreman DHCP)
    ipaserver_reverse_zones:
      - "122.168.192.in-addr.arpa"
      - "168.192.in-addr.arpa"

    # --- Firewall Settings ---
    # The role has a built-in feature to automatically open the exact
    # ports needed for LDAP, Kerberos, DNS, and Dogtag (CA).
    ipaserver_setup_firewalld: true

  pre_tasks:
    - name: Ensure hostname is set to FQDN (Strict IdM requirement)
      ansible.builtin.hostname:
        name: "{{ idm_hostname }}"

    - name: Add hostname to /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ static_ip }} {{ idm_hostname }}" # Change to your actual FQDN
        state: present

    # Register to satellite server using activation key and organization ID
    - name: Registering system using activation key and organization ID
      ansible.builtin.include_role:
        name: redhat.rhel_system_roles.rhc
      vars:
        rhc_auth:
          activation_keys:
            keys:
              - "{{ activationKey }}"
        rhc_organization: "{{ organizationID }}"
      tags:
        - tag_register

    - name: Disable all current repositories
      ansible.builtin.command: "subscription-manager repos --disable '*'"
      changed_when: false
      tags:
        - tag_repositories

    - name: Enable required repositories for IdM
      ansible.builtin.command: >
        subscription-manager repos
        --enable=rhel-9-for-x86_64-baseos-rpms
        --enable=rhel-9-for-x86_64-appstream-rpms
      changed_when: false
      tags:
        - tag_repositories

    - name: Ensure firewalld and ipa-client are installed (required for the role to configure it)
      ansible.builtin.dnf:
        name:
          - firewalld
          - python3-firewall
          - ipa-client
        state: present

    - name: Ensure firewalld is running and enabled
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: true

    # Install ipaserver before role to avoid bug
    - name: Install ipaserver package to avoid role bug
      ansible.builtin.dnf:
        best: false
        name:
          - ipa-server
          - python3-ipapython
          - ipa-server-dns
        #  - ipa-server-firewall
        state: present


  roles:
    # Use the official Red Hat supported role from the ansible-freeipa package
    - role: redhat.rhel_idm.ipaserver
      state: present
