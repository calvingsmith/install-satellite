---
# Apply lab-only demo roles on RHEL 9 hosts registered to Satellite (inventory + Lightspeed IOP).
#
# Recommendation demo (lightspeed_demo_recommendation): reversible misconfiguration surfaced in
#   Red Hat Lightspeed > Recommendations after advisor processing.
# Vulnerability demo (lightspeed_demo_vulnerability): adjust installed RPMs so Lightspeed > Vulnerability
#   can correlate CVEs (requires CVE map sync on Satellite and often an older NVR from your repos).
#
# Import these roles into Satellite for assignment via host group:
#   1. Copy roles/lightspeed_demo_recommendation and roles/lightspeed_demo_vulnerability to the Satellite
#      (or Capsule) Ansible role path, e.g. /usr/share/ansible/roles/
#   2. hammer ansible roles import --proxy-id <ID> \
#        --role-names lightspeed_demo_recommendation,lightspeed_demo_vulnerability
#   3. Assign roles in the UI or hammer host/hostgroup, then run Remote Execution job from Satellite if desired.
#
# === Optional: provision a VM from Satellite (nested host group rhel9-server/lightspeed-demo) ===
# Requires satellite-lightspeed-demo.yml (or equivalent) to have created the nested group; post-install must
# have created the parent rhel9-server host group with libvirt compute resource, subnet, realm, etc.
# The libvirt compute profile must attach guests to the host bridge (vm_network); see roles/libvirt_compute_profile
# and post-install.yml, or ansible-playbook -i inventory post-install.yml --tags libvirt_compute_profile_refresh.
# Creates a managed host, sets build context, and requests the compute resource to start the guest.
#
#   ansible-playbook -i inventory lightspeed-demo-client.yml --tags provision_demo
# Teardown (remove Foreman host + linked VM on compute resource): delete_lightspeed_demo.yml
#
# Variables (override with -e or via role defaults in roles/provision_demo/defaults/main.yml):
#   provision_demo_vm        — default true for the provision play; set false to skip
#   lightspeed_demo_vm_fqdn          — default test-ls.laptop.lab
#   lightspeed_demo_hostgroup_parent  — default rhel9-server (match rhel9_provisioning / satellite-lightspeed-demo)
#   lightspeed_demo_hostgroup_name    — nested segment; default lightspeed-demo (full title parent/child)
#   provision_demo_wait_ssh  — default true; wait for SSH on the new guest before the next play
#   lightspeed_demo_vm_wait_host      — host/IP for wait_for (default: lightspeed_demo_vm_fqdn); use if DNS lags
#   provision_demo_ssh_wait_delay     — seconds before first TCP check (default 90)
#   provision_demo_ssh_wait_timeout   — max seconds to wait for port 22 (default 3600)
#   lightspeed_demo_flush_controller_cache — flush systemd-resolved DNS on the machine running the playbook
#     (default: true) so test-ls FQDN resolves after IdM/forwarder update; set false to skip or on non-Fedora/RHEL
#   lightspeed_demo_clear_known_hosts — remove test-ls from ~/.ssh/known_hosts on the controller (rebuilds change keys)
#   lightspeed_demo_extra_known_host_names — list of extra names/IPs to clear (e.g. a static wait_for address)
#   lightspeed_demo_controller_known_hosts_path — override path to known_hosts (default: $HOME/.ssh/known_hosts)
#
# Template upload variables (satellite_soe_templates role):
#   satellite_soe_templates_list — override to upload a subset of templates
#
# HTTPS: place ./ca.crt in the repo root (see httpboot-demo.yml) or set satellite_ca_path / satellite_validate_certs.
#
# Run demo roles only (after the VM is reachable over SSH):
#   ansible-playbook -i inventory lightspeed-demo-client.yml --limit test-ls.laptop.lab
# Second play uses root + root_password from vault (same as Foreman root_pass). RHEL 9+ sshd defaults
# to prohibit-password for root, so password SSH fails with "Invalid/incorrect password" unless the
# SOE kickstart has applied (host param lab_permit_root_password_ssh on lightspeed-demo) — re-publish the
# SOE template, run satellite-lightspeed-demo (lightspeed_demo_hostgroup), rebuild the VM, or on an
# already-installed host add: PermitRootLogin yes in /etc/ssh/sshd_config.d/ and systemctl reload sshd.
# Install sshpass on the controller for non-interactive password auth; or use key only and override
# ansible_user / ansible_ssh_private_key_file.
#
# Tags:
#   provision_demo — Satellite API: create host + build + start VM
#   lightspeed_demo_recommendation, lightspeed_demo_vulnerability — role tasks (unchanged)

- name: Provision Lightspeed demo VM via Satellite
  hosts: satellite_group
  connection: local
  gather_facts: false
  tags:
    - provision_demo
  vars_files:
    - "~/vault/satellite.yml"
    - "~/vault/secrets.yml"
    - "{{ playbook_dir }}/laptop.lab.yml"

  module_defaults:
    group/redhat.satellite.satellite:
      username: "{{ satellite_username | default('admin') }}"
      password: "{{ satellite_password }}"
      server_url: "{{ satellite_url }}"
      validate_certs: "{{ satellite_validate_certs | default(true) }}"
      ca_path: "{{ satellite_ca_path | default(omit) }}"

  pre_tasks:
    - name: Skip Satellite provision play when disabled
      when: not (provision_demo_vm | default(true) | bool)
      ansible.builtin.meta: end_play

    - name: Detect CA certificate for Satellite API
      ansible.builtin.import_role:
        name: satellite_soe_templates
        tasks_from: detect_ca

    - name: Require root_password in vault for managed host kickstart (root_pass)
      ansible.builtin.assert:
        that:
          - root_password is defined
          - root_password | length > 0
        fail_msg: >-
          Define root_password in ~/vault/satellite.yml so Satellite can inject the kickstart root password.

    - name: Ensure Foreman subnet has correct DHCP proxy, IPAM, and kernel options
      block:
        - name: Look up Foreman subnet
          ansible.builtin.uri:
            url: "{{ satellite_url | regex_replace('/$', '') }}/api/v2/subnets?search=name={{ foreman_subnet_name | urlencode }}"
            url_username: "{{ satellite_username | default('admin') }}"
            url_password: "{{ satellite_password }}"
            force_basic_auth: true
            validate_certs: "{{ satellite_validate_certs | default(true) }}"
            ca_path: "{{ satellite_ca_path | default(omit) }}"
            return_content: true
          register: _subnet_lookup
          delegate_to: localhost
          run_once: true # noqa: run-once[task]

        - name: Look up Satellite smart proxy ID for DHCP
          vars:
            _proxy_name: "{{ satellite_smart_proxy_name | default('satellite.laptop.lab') }}"
          ansible.builtin.uri:
            url: "{{ satellite_url | regex_replace('/$', '') }}/api/v2/smart_proxies?search=name%3D{{ _proxy_name | urlencode }}"
            url_username: "{{ satellite_username | default('admin') }}"
            url_password: "{{ satellite_password }}"
            force_basic_auth: true
            validate_certs: "{{ satellite_validate_certs | default(true) }}"
            ca_path: "{{ satellite_ca_path | default(omit) }}"
            return_content: true
          register: _proxy_lookup
          delegate_to: localhost
          run_once: true # noqa: run-once[task]

        - name: PUT subnet with correct DHCP, HTTPBoot, TFTP proxies and kernel options
          ansible.builtin.uri:
            url: "{{ satellite_url | regex_replace('/$', '') }}/api/v2/subnets/{{ _subnet_lookup.json.results[0].id }}"
            method: PUT
            url_username: "{{ satellite_username | default('admin') }}"
            url_password: "{{ satellite_password }}"
            force_basic_auth: true
            validate_certs: "{{ satellite_validate_certs | default(true) }}"
            ca_path: "{{ satellite_ca_path | default(omit) }}"
            body_format: json
            body:
              subnet:
                dhcp_id: "{{ _proxy_lookup.json.results[0].id }}"
                # verify-subnet-httpboot: include httpboot_id so the subnet's HTTPBoot proxy is set/kept.
                # The SOE PXEGrub2 template checks subnet.httpboot.httpboot_http_port to emit the efi_http
                # GRUB menuentry; without this the template falls back to entry index 0 (TFTP).
                httpboot_id: "{{ _proxy_lookup.json.results[0].id }}"
                tftp_id: "{{ _proxy_lookup.json.results[0].id }}"
                ipam: "DHCP"
                kernel_opts: "inst.noverifyssl"
            status_code: [200, 201]
          register: _subnet_update_result
          delegate_to: localhost
          run_once: true # noqa: run-once[task]
          when: >-
            (_subnet_lookup.json.results | default([]) | length) > 0 and
            (_proxy_lookup.json.results | default([]) | length) > 0

  roles:
    - role: satellite_soe_templates
    - role: provision_demo

- name: Post-provision — lab network access on provisioned guest
  hosts: lightspeed_demo_clients
  gather_facts: true
  become: true
  tags:
    - provision_demo
    - lightspeed_demo_disk_boot
  vars:
    lightspeed_demo_vm_fqdn: test-ls.laptop.lab
  tasks:
    - name: Ensure firewalld is enabled and running before zone changes
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true
      failed_when: false

    - name: Set firewalld default zone to internal (lab network access)
      ansible.builtin.command: firewall-cmd --set-default-zone=internal
      register: _fw_set_zone
      changed_when: "'success' in (_fw_set_zone.stdout | default(''))"
      failed_when: false

    # Use nmcli to assign zone on all active non-loopback NM connections.
    # firewall-cmd --change-interface uses ansible_default_ipv4.interface which may be wrong or
    # missing on a freshly booted VM. nmcli modifies the connection profile directly so the zone
    # survives reconnects and reboots without relying on Ansible fact collection.
    - name: Assign all active NM connections to internal zone via nmcli
      ansible.builtin.shell: |
        set -o pipefail
        changed=0
        while IFS=: read -r uuid type device; do
          [ "$type" = "loopback" ] && continue
          [ -z "$uuid" ] && continue
          cur_zone=$(nmcli -t -f connection.zone connection show "$uuid" 2>/dev/null \
            | cut -d: -f2 | tr -d ' ')
          if [ "$cur_zone" != "internal" ]; then
            nmcli connection modify "$uuid" connection.zone internal && changed=1
          fi
        done < <(nmcli -t -f UUID,TYPE,DEVICE connection show --active 2>/dev/null)
        if [ "$changed" = "1" ]; then
          nmcli connection reload
          firewall-cmd --reload 2>/dev/null || true
        fi
        printf 'nmcli_zone_fix changed=%s\n' "$changed"
      args:
        executable: /bin/bash
      register: _fw_nmcli_zone
      changed_when: "'changed=1' in (_fw_nmcli_zone.stdout | default(''))"
      failed_when: _fw_nmcli_zone.rc != 0

    - name: Show nmcli zone assignment result
      ansible.builtin.debug:
        msg: "{{ _fw_nmcli_zone.stdout | default('no output') }}"

- name: Lightspeed IOP demo — recommendation and vulnerability triggers
  hosts: lightspeed_demo_clients
  become: true
  gather_facts: true
  vars_files:
    - "~/vault/satellite.yml"
    - "~/vault/secrets.yml"
    - "{{ playbook_dir }}/laptop.lab.yml"
  roles:
    - role: lightspeed_demo_recommendation
      tags:
        - lightspeed_demo_recommendation
    - role: lightspeed_demo_vulnerability
      tags:
        - lightspeed_demo_vulnerability
