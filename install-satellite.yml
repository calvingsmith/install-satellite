---
- name: Phase 1 - Provision libvirt Virtual Machine
  hosts: localhost
  connection: local
  become: true
  tags:
    - provision

  vars_files:
    - ~/vault/satellite.yml  # This file should contain the sensitive variables like root_password
    - host_vars/satellite.laptop.lab/satellite.laptop.lab.yml   # This file should contain the VM specs and hostname for Satellite
    - laptop.lab.yml       # This file should contain the static IP and other non-sensitive variables

  vars:
    vm_name: "satellite-server"
    base_image_path: "/home/casmith/VirtualMachines/images/rhel-9.7-x86_64-kvm.qcow2" # Point this to your RHEL qcow2 image
    vm_disk_path: "/home/casmith/VirtualMachines/{{ vm_name }}.qcow2"

  tasks:
    - name: Check if the VM disk already exists
      ansible.builtin.stat:
        path: "{{ vm_disk_path }}"
      register: vm_disk_stat

    - name: End play if VM disk already exists
      ansible.builtin.meta: end_host
      when: vm_disk_stat.stat.exists

    - name: Copy base RHEL image to new VM disk
      ansible.builtin.copy:
        src: "{{ base_image_path }}"
        dest: "{{ vm_disk_path }}"
        remote_src: true
        force: false
        mode: preserve

    - name: Resize the VM disk to 200GB
      ansible.builtin.command: "qemu-img resize {{ vm_disk_path }} {{ vm_disk_size }}"
      register: resize_result
      changed_when: resize_result.rc == 0

    - name: Template the network configuration for static IP
      ansible.builtin.template:
        src: eth0.conf.j2
        dest: /tmp/eth0.conf
        mode: preserve

    - name: Use virt-customize to set IP address, grow partition and inject SSH key
      ansible.builtin.command: >
        virt-customize -a {{ vm_disk_path }} \
        --root-password password:{{ root_password }} \
        --hostname "{{ hostname }}" \
        --upload /tmp/eth0.conf:/etc/NetworkManager/system-connections/Wired\ Connection\ 1.nmconnection \
        --chmod 0600:/etc/NetworkManager/system-connections/Wired\ Connection\ 1.nmconnection \
        --run-command "xfs_growfs /dev/sda4" \
        --ssh-inject root:file://{{ ssh_pub_key_file }}
      register: customize_result
      changed_when: customize_result.rc == 0

    - name: Define and start the Satellite VM
      community.libvirt.virt:
        command: define
        xml: "{{ lookup('template', 'vm_template.xml.j2') }}" # See note below about this template

    - name: Start the Virtual Machine
      community.libvirt.virt:
        name: "{{ vm_name }}"
        state: running

    - name: Wait for SSH to come up
      ansible.builtin.wait_for:
        host: "{{ static_ip }}"
        port: 22
        delay: 15
        timeout: 300
        state: started

- name: Phase 2 - Register to Red Hat and Install Satellite
  hosts: satellite_group
  become: true
  vars_files:
    - ~/vault/satellite.yml  # Lab / Satellite identity (e.g. root_password, activation keys)
    - ~/vault/secrets.yml  # IdM passwords, cdn_*_vault (portal / manifest)
    - laptop.lab.yml       # This file should contain the static IP and other non-sensitive variables
  tags:
    - install
  vars:
    satellite_version: "6.18" # Update to your target version
    foreman_proxy_realm_principal: "realm-capsule"


  tasks:
    - name: Set hostname to FQDN (Required for Satellite)
      ansible.builtin.hostname:
        name: "satellite.laptop.lab" # Change to your actual FQDN

  # Add the hostname to the /etchosts file to ensure it resolves locally
    - name: Add hostname to /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ static_ip }} satellite.laptop.lab" # Change to your actual FQDN
        state: present
  # clean dnf cache to prevent metadata issues
    - name: Clean DNF cache
      ansible.builtin.command: "dnf clean all"
      changed_when: false

    - name: Registering system using activation key and organization ID
      ansible.builtin.include_role:
        name: redhat.rhel_system_roles.rhc
      vars:
        rhc_auth:
          activation_keys:
            keys: ["{{ activationKey }}"]
        rhc_organization: "{{ organizationID }}"
       # rhc_insights:
       #   state: present

    - name: Disable all current repositories
      ansible.builtin.command: "subscription-manager repos --disable '*'"
      changed_when: false
      tags:
        - tag_repositories

    - name: Enable required repositories for Satellite
      ansible.builtin.command: >
        subscription-manager repos
        --enable=rhel-9-for-x86_64-baseos-rpms
        --enable=rhel-9-for-x86_64-appstream-rpms
        --enable=satellite-{{ satellite_version }}-for-rhel-9-x86_64-rpms
        --enable=satellite-maintenance-{{ satellite_version }}-for-rhel-9-x86_64-rpms
      register: repo_enable
      changed_when: repo_enable.rc == 0
      tags:
        - tag_repositories

# Update system
    # - name: Update all packages to the latest version # noqa: package-latest
    #   ansible.builtin.dnf:
    #     disable_plugin:
    #       - foreman-protector
    #     name:
    #       - "*"
    #     state: latest


    # - name: Enable AppStream repository (if not already enabled)
    #   ansible.builtin.command: >
    #     subscription-manager repos --enable rhel-9-for-x86_64-appstream-rpms
    #   register: enable_appstream
    #   changed_when: "'Repository 'rhel-9-for-x86_64-appstream-rpms' is enabled for the system.' not in enable_appstream.stdout"


    - name: Install Satellite server package and supporting packages
      ansible.builtin.dnf:
        disable_plugin: foreman-protector
        # best: false   # https://issues.redhat.com/browse/RHEL-97629
        name:
          - ipa-admintools
          - python3-ipapython
          - python3-ipaclient
          - python3-ipalib
          - pip
          - firewalld
          - python3-firewall
        state: present

    - name: Enable and start firewalld service
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: "Apply satellite_pre role to prepare for installation"
      ansible.builtin.include_role:
        name: satellite_pre
      tags:
        - tags_satellite_pre
        - tags_pre_sync

    - name: Discover Satellite NIC on provisioning network
      ansible.builtin.shell: |
        ip -br addr show | awk '/{{ satellite_server_ip | regex_escape() }}\// {print $1; exit}'
      register: _sat_dhcp_iface
      changed_when: false
      failed_when: _sat_dhcp_iface.stdout | trim | length == 0

    - name: Run satellite-installer
      ansible.builtin.command:
        argv:
          - satellite-installer
          - --scenario
          - satellite
          - --foreman-initial-admin-username
          - admin
          - --foreman-initial-admin-password
          - '{{ root_password }}'
          - --foreman-proxy-dns
          - 'true'
          - --foreman-proxy-dns-managed
          - 'false'
          - --foreman-proxy-dns-provider
          - "nsupdate_gss" # nsupdate_gss1 is the provider for freeipa integration, if using bind9 this would be "nsupdate_bind9"
          - --foreman-proxy-dns-server
          - "{{ ipa_server_fqdn }}"
          - --foreman-proxy-dns-tsig-keytab
          - "/etc/foreman-proxy/freeipa.keytab"
          - --foreman-proxy-dns-tsig-principal
          - "{{ foreman_proxy_realm_principal }}"
          - --foreman-proxy-httpboot
          - 'true'
          - --foreman-proxy-http
          - 'true'
          - --foreman-proxy-tftp
          - 'true'
          - --foreman-proxy-dhcp
          - 'true'
          - --foreman-proxy-dhcp-provider
          - isc
          - --foreman-proxy-dhcp-managed
          - 'true'
          - --foreman-proxy-dhcp-interface
          - "{{ _sat_dhcp_iface.stdout | trim }}"
          - --foreman-proxy-dhcp-range
          - "{{ dhcp_range }}"
          - --foreman-proxy-dhcp-gateway
          - "{{ gateway_ip }}"
          - --foreman-proxy-dhcp-nameservers
          - "{{ idm_server_ip }}"
          - --
      register: installer_output
      # This step takes a long time.
      changed_when: "'Installation complete' in installer_output.stdout"
      async: 3600
      poll: 60

    - name: Display Satellite Installer Output
      ansible.builtin.debug:
        msg: "Installer output: {{ installer_output.stdout_lines }}"
