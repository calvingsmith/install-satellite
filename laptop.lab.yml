---
vm_network: "default" # Assuming libvirt default network is being used
subnet_cidr: "24"
gateway_ip: "192.168.122.1"
satellite_server_ip: "192.168.122.5"
idm_server_ip: "192.168.122.4"

# --- Core IdM Settings ---
ipaserver_domain: "laptop.lab"
ipaserver_realm: "LAPTOP.LAB"
# ipaserver_no_forwarders: "true"
idm_hostname: "idm.laptop.lab"
dhcp_range: "192.168.122.100 192.168.122.200"
# Foreman/Satellite Subnet API (roles/foreman_subnet); must match DHCP/IdM in install-satellite.yml
foreman_subnet_network: "192.168.122.0"
foreman_subnet_name: "laptop-lab-provisioning"
ipaserver_reverse_zones:
  - "122.168.192.in-addr.arpa"
  - "168.192.in-addr.arpa"
