---
# Append one NDJSON debug line (debug session 754f4a). Pass lightspeed_demo_debug_payload dict.
- name: Append Lightspeed demo debug log line
  ansible.builtin.lineinfile:
    path: "{{ playbook_dir }}/.cursor/debug-754f4a.log"
    line: "{{ lightspeed_demo_debug_payload | to_json }}"
    create: true
    mode: "0644"
  delegate_to: localhost
  become: false
  changed_when: false
