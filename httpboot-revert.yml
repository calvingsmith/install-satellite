---
# Undo the Satellite changes applied by httpboot-demo.yml:
#   - Point the RHEL 9 default PXEGrub2 back at the stock template (default: Kickstart default PXEGrub2).
#   - Drop "SOE Kickstart Default PXEGrub2" from the OS provisioning template associations.
#   - Remove the SOE provisioning template from Satellite (optional; see httpboot_revert_delete_template).
#
# Uses the same vault files, host, and OS search variables as httpboot-demo.yml:
#   ansible-playbook -i inventory httpboot-revert.yml
#   -e httpboot_demo_rhel9_minor=6
#   -e 'httpboot_demo_os_search=name = "RedHat" and major = 9 and minor = "6"'
#
# If your environment used a different default PXEGrub2 before the demo, set:
#   -e httpboot_revert_default_pxegrub2='Your Previous Template Name'
#
# To keep the SOE template object in Satellite (only undo OS/default bindings):
#   -e httpboot_revert_delete_template=false

- name: Revert HTTP boot demo (SOE PXEGrub2)
  hosts: satellite.laptop.lab
  connection: local
  gather_facts: false
  vars_files:
    - "~/vault/satellite.yml"
    - "~/vault/secrets.yml"
    - "{{ playbook_dir }}/laptop.lab.yml"
  vars:
    httpboot_revert_pxegrub2_name: SOE Kickstart Default PXEGrub2
    httpboot_revert_default_pxegrub2: Kickstart default PXEGrub2
    httpboot_revert_delete_template: true

  pre_tasks:
    - name: Stat optional repo-root CA for Satellite API (./ca.crt)
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/ca.crt"
      register: httpboot_revert_ca_crt_stat

    - name: Default satellite_ca_path to repo ca.crt when file exists
      ansible.builtin.set_fact:
        satellite_ca_path: "{{ playbook_dir }}/ca.crt"
      when:
        - satellite_ca_path is not defined
        - httpboot_revert_ca_crt_stat.stat.exists

  tasks:
    - name: Resolve Foreman search string for RHEL 9 OS (same logic as httpboot-demo.yml)
      ansible.builtin.set_fact:
        httpboot_demo_os_search_effective: >-
          {{
            httpboot_demo_os_search
            if httpboot_demo_os_search is defined
            else (
              'name = "RedHat" and major = 9 and minor = "'
              ~ (httpboot_demo_rhel9_minor | default('7') | string)
              ~ '"'
            )
          }}

    - name: Look up RHEL 9 operating system (full API record)
      redhat.satellite.resource_info:
        username: "{{ satellite_username | default('admin') }}"
        password: "{{ satellite_password }}"
        server_url: "{{ satellite_url }}"
        validate_certs: "{{ satellite_validate_certs | default(true) }}"
        ca_path: "{{ satellite_ca_path | default(omit) }}"
        resource: operatingsystems
        search: "{{ httpboot_demo_os_search_effective }}"
        full_details: true
      register: httpboot_rhel9_os

    - name: Require exactly one operating system for httpboot_demo_os_search_effective
      ansible.builtin.assert:
        that:
          - httpboot_rhel9_os.resources | length == 1
        fail_msg: >-
          Expected one OS for search [{{ httpboot_demo_os_search_effective }}], got {{ httpboot_rhel9_os.resources | length }}.
          Use the same -e httpboot_demo_rhel9_minor=... or -e httpboot_demo_os_search=... as for httpboot-demo.yml.

    - name: Cache OS entity and current provisioning template names
      ansible.builtin.set_fact:
        httpboot_revert_os_entity: "{{ httpboot_rhel9_os.resources[0] }}"
        httpboot_revert_current_template_names: >-
          {{ httpboot_rhel9_os.resources[0].provisioning_templates | default([], true) | map(attribute='name') | list }}

    - name: Fail if stock default PXEGrub2 is not linked to this OS
      ansible.builtin.assert:
        that:
          - httpboot_revert_default_pxegrub2 in httpboot_revert_current_template_names
        fail_msg: >-
          Template [{{ httpboot_revert_default_pxegrub2 }}] is not associated with OS [{{ httpboot_revert_os_entity.title }}].
          Associate it in the UI or pass -e httpboot_revert_default_pxegrub2='...' naming a PXEGrub2 template that is already linked.

    - name: Compute provisioning template list without SOE PXEGrub2
      ansible.builtin.set_fact:
        httpboot_revert_restored_template_names: "{{ httpboot_revert_current_template_names | difference([httpboot_revert_pxegrub2_name]) | list }}"

    - name: Refuse to clear all provisioning templates from the OS
      ansible.builtin.assert:
        that:
          - httpboot_revert_restored_template_names | length > 0
        fail_msg: >-
          After removing [{{ httpboot_revert_pxegrub2_name }}], no templates would remain on [{{ httpboot_revert_os_entity.title }}].
          Fix OS associations in Satellite before running this playbook.

    - name: Set default PXEGrub2 for RHEL 9 back to stock (before dropping SOE association)
      redhat.satellite.os_default_template:
        username: "{{ satellite_username | default('admin') }}"
        password: "{{ satellite_password }}"
        server_url: "{{ satellite_url }}"
        validate_certs: "{{ satellite_validate_certs | default(true) }}"
        ca_path: "{{ satellite_ca_path | default(omit) }}"
        state: present
        operatingsystem: "{{ httpboot_revert_os_entity.title }}"
        template_kind: PXEGrub2
        provisioning_template: "{{ httpboot_revert_default_pxegrub2 }}"

    - name: Associate restored provisioning templates with the RHEL 9 operating system (without SOE)
      redhat.satellite.operatingsystem:
        username: "{{ satellite_username | default('admin') }}"
        password: "{{ satellite_password }}"
        server_url: "{{ satellite_url }}"
        validate_certs: "{{ satellite_validate_certs | default(true) }}"
        ca_path: "{{ satellite_ca_path | default(omit) }}"
        state: present
        name: "{{ httpboot_revert_os_entity.name }}"
        major: "{{ httpboot_revert_os_entity.major }}"
        minor: "{{ httpboot_revert_os_entity.minor }}"
        os_family: "{{ httpboot_revert_os_entity.family }}"
        provisioning_templates: "{{ httpboot_revert_restored_template_names }}"

    - name: Remove SOE Kickstart Default PXEGrub2 provisioning template from Satellite
      when: httpboot_revert_delete_template | bool
      redhat.satellite.provisioning_template:
        username: "{{ satellite_username | default('admin') }}"
        password: "{{ satellite_password }}"
        server_url: "{{ satellite_url }}"
        validate_certs: "{{ satellite_validate_certs | default(true) }}"
        ca_path: "{{ satellite_ca_path | default(omit) }}"
        state: absent
        name: "{{ httpboot_revert_pxegrub2_name }}"

    - name: Show revert summary
      ansible.builtin.debug:
        msg: >-
          Default PXEGrub2 for [{{ httpboot_revert_os_entity.title }}] set to [{{ httpboot_revert_default_pxegrub2 }}];
          SOE template removed from OS associations{% if httpboot_revert_delete_template | bool %} and deleted from Satellite{% else %} (SOE template object left in Satellite){% endif %}.
