---
# Install Red Hat Lightspeed in Satellite (local IOP containers): Insights-style advisor
# recommendations and the vulnerability service (Technology Preview), without using the
# Hybrid Cloud Console for registered hosts.
#
# References (Satellite 6.18):
#   - Installing Red Hat Lightspeed in Satellite on a connected server: podman login +
#     satellite-installer --enable-iop
#   - Vulnerability UI is Technology Preview; install anyway for demo/lab use.
#   - With Lightspeed in Satellite enabled, hosted Hybrid Cloud services are not used for
#     hosts registered to this Satellite. External databases are not supported with IOP.
#
# Prerequisites:
#   - Satellite Server with Podman; connected pull access to registry.redhat.io (or follow
#     disconnected ISO/setup_containers flow outside this playbook).
#   - On the Ansible controller: ~/.docker/config.json after `docker login` / `podman login`
#     (Podman may use ~/.config/containers/auth.json — set lightspeed_registry_authfile_src).
#     The registry token is stored under auths as base64; it is copied to /etc/foreman/registry-auth.json.
#
# Variables (override with -e):
#   lightspeed_registry_authfile_src — path on the controller (default: $HOME/.docker/config.json)
#   satellite_version                — optional, e.g. "6.18"; if unset, derived from rpm -q satellite
#
# Optional:
#   lightspeed_skip_podman_login       — true to skip copying auth (use existing Satellite file)
#   lightspeed_https_proxy               — if set, configure iop-cvemap-download.service for CVE map
#   lightspeed_no_proxy                  — optional NO_PROXY for that service (default: localhost)
#
# Run (from repo root, adjust inventory):
#   ansible-playbook -i inventory satellite-lightspeed-demo.yml
#
# Demo roles for content hosts (Recommendations + Vulnerability UI):
#   roles/lightspeed_demo_recommendation, roles/lightspeed_demo_vulnerability
# This playbook can copy them to the Satellite, hammer-import them, and create a nested host group
#   <rhel9-server>/lightspeed-demo (clone of rhel9-server) with those roles assigned.
# Requires the parent host group rhel9-server (e.g. post-install.yml tags_hostgroup) to exist first.
#
# Optional (disable host group / role sync):
#   -e lightspeed_demo_configure_hostgroup=false
#
# Override nested group name or parent:
#   -e lightspeed_demo_hostgroup_parent=rhel9-server -e lightspeed_demo_hostgroup_name=lightspeed-demo
#
# The nested host group sets SOE host params: lab_permit_root_password_ssh (root+password for Ansible) and
# lab_bootstrap_authorized_key (one line from the controller’s ~/.ssh/casmith.pub when the file exists and
# the variable is not set in laptop.lab). Re-publish the SOE template and rebuild the VM so kickstart
# seeds /root/.ssh/authorized_keys; then lightspeed-demo-client can use ~/.ssh/casmith for the first SSH.

- name: Enable Red Hat Lightspeed in Satellite (IOP — advisor + vulnerability preview)
  hosts: satellite_group
  become: true
  gather_facts: true
  vars_files:
    - "~/vault/satellite.yml"
    - "~/vault/secrets.yml"
    - "{{ playbook_dir }}/laptop.lab.yml"
  vars:
    lightspeed_skip_podman_login: false
    lightspeed_no_proxy: "localhost"
    lightspeed_registry_authfile_src: "{{ lookup('env', 'HOME') }}/.docker/config.json"
    lightspeed_demo_configure_hostgroup: true
    lightspeed_demo_hostgroup_parent: "{{ rhel9_hostgroup_name | default('rhel9-server') }}"
    lightspeed_demo_hostgroup_name: lightspeed-demo
    lightspeed_demo_hammer_import_role_names: lightspeed_demo_recommendation,lightspeed_demo_vulnerability
    lightspeed_demo_hostgroup_ansible_roles:
      - RedHatInsights.insights-client
      - lightspeed_demo_recommendation
      - lightspeed_demo_vulnerability

  pre_tasks:
    - name: Check local Docker/Podman auth file on controller
      when: not (lightspeed_skip_podman_login | bool)
      ansible.builtin.stat:
        path: "{{ lightspeed_registry_authfile_src }}"
      delegate_to: localhost
      become: false
      register: lightspeed_local_auth_stat

    - name: Require local auth file when installing registry credentials
      when: not (lightspeed_skip_podman_login | bool)
      ansible.builtin.assert:
        that:
          - lightspeed_local_auth_stat.stat.exists | default(false)
          - lightspeed_local_auth_stat.stat.isreg | default(false)
        fail_msg: >-
          Missing {{ lightspeed_registry_authfile_src }} on the Ansible controller.
          Run: podman login registry.redhat.io (or docker login). Or set -e lightspeed_skip_podman_login=true
          if /etc/foreman/registry-auth.json is already configured on the Satellite.

    - name: Check Satellite RPM is installed
      ansible.builtin.command: rpm -q satellite
      register: lightspeed_rpm_check
      changed_when: false
      failed_when: lightspeed_rpm_check.rc != 0

  tasks:
    - name: Query Satellite RPM version
      when: satellite_version is not defined
      ansible.builtin.command: rpm -q --qf '%{VERSION}' satellite
      register: lightspeed_rpm_version
      changed_when: false

    - name: Set effective Satellite version for installer flags
      ansible.builtin.set_fact:
        lightspeed_satellite_version_effective: "{{ satellite_version if satellite_version is defined else lightspeed_rpm_version.stdout }}"

    - name: Choose installer mode (6.18+ uses --enable-iop; 6.17 uses legacy advisor flag)
      ansible.builtin.set_fact:
        lightspeed_installer_uses_legacy_advisor: "{{ lightspeed_satellite_version_effective is version('6.18', '<') }}"

    - name: Fail on Satellite versions older than 6.17 (no supported IOP installer in this playbook)
      ansible.builtin.assert:
        that:
          - lightspeed_satellite_version_effective is version('6.17', '>=')
        fail_msg: >-
          Red Hat Lightspeed in Satellite (IOP) requires at least Satellite 6.17. This host reports [{{ lightspeed_satellite_version_effective }}].

    - name: Install Foreman registry auth from controller Docker config (token in auths)
      when: not (lightspeed_skip_podman_login | bool)
      ansible.builtin.copy:
        src: "{{ lightspeed_registry_authfile_src }}"
        dest: /etc/foreman/registry-auth.json
        owner: root
        group: root
        mode: "0600"
      # File contains base64 credentials; avoid logging contents.
      no_log: true

    - name: Enable IOP (Lightspeed advisor + vulnerability containers) via satellite-installer
      ansible.builtin.command:
        argv: "{{ lightspeed_installer_argv }}"
      register: lightspeed_installer
      changed_when: true
      async: 3600
      poll: 15
      vars:
        lightspeed_installer_argv: >-
          {{
            ['satellite-installer', '--foreman-plugin-rh-cloud-enable-iop-advisor-engine', 'true']
            if lightspeed_installer_uses_legacy_advisor | bool
            else ['satellite-installer', '--enable-iop']
          }}

    - name: Show satellite-installer result
      ansible.builtin.debug:
        msg: "satellite-installer finished with rc={{ lightspeed_installer.rc | default('n/a') }}"

    - name: Optional — configure HTTP proxy for CVE map downloads (Lightspeed vulnerability preview)
      when: lightspeed_https_proxy is defined and lightspeed_https_proxy | length > 0
      block:
        - name: Ensure systemd override directory for iop-cvemap-download exists
          ansible.builtin.file:
            path: /etc/systemd/system/iop-cvemap-download.service.d
            state: directory
            mode: "0755"

        - name: Drop in proxy environment for iop-cvemap-download.service
          ansible.builtin.copy:
            dest: /etc/systemd/system/iop-cvemap-download.service.d/proxy.conf
            mode: "0644"
            content: |
              [Service]
              Environment=HTTPS_PROXY={{ lightspeed_https_proxy }}
              Environment=NO_PROXY={{ lightspeed_no_proxy }}
          notify: Reload systemd and restart iop-cvemap-download

    - name: Push Lightspeed demo Ansible roles to Satellite and import into Foreman
      when: lightspeed_demo_configure_hostgroup | bool
      tags:
        - lightspeed_demo_hostgroup
      block:
        - name: Copy Lightspeed demo role trees to /usr/share/ansible/roles on Satellite
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/roles/{{ item }}"
            dest: /usr/share/ansible/roles/
            owner: root
            group: root
          loop:
            - lightspeed_demo_recommendation
            - lightspeed_demo_vulnerability

        # --output is a global hammer option; it must follow "hammer", not the subcommand.
        - name: Get Smart Proxy ID for Ansible role import
          ansible.builtin.command:
            argv:
              - hammer
              - "--output"
              - json
              - proxy
              - info
              - "--name"
              - "{{ satellite_smart_proxy_name }}"
          register: lightspeed_demo_proxy_info
          changed_when: false

        - name: Set Smart Proxy ID for hammer ansible import
          vars:
            _proxy: "{{ lightspeed_demo_proxy_info.stdout | from_json }}"
          ansible.builtin.set_fact:
            lightspeed_demo_ansible_proxy_id: "{{ _proxy.id | default(_proxy.Id) }}"

        - name: Import Lightspeed demo Ansible roles into Satellite
          ansible.builtin.command:
            argv:
              - hammer
              - ansible
              - roles
              - import
              - "--proxy-id"
              - "{{ lightspeed_demo_ansible_proxy_id | string }}"
              - "--role-names"
              - "{{ lightspeed_demo_hammer_import_role_names }}"
          register: lightspeed_demo_hammer_import
          changed_when: lightspeed_demo_hammer_import.rc == 0
          failed_when: lightspeed_demo_hammer_import.rc != 0

  post_tasks:
    - name: Reminder — vulnerability is Technology Preview
      ansible.builtin.debug:
        msg: >-
          Red Hat Lightspeed > Vulnerability in the UI is a Technology Preview. Advisor recommendations:
          Red Hat Lightspeed > Recommendations. If hammer ping omits advisor/vulnerability services,
          run: satellite-maintain service restart

  handlers:
    - name: Reload systemd and restart iop-cvemap-download
      ansible.builtin.systemd:
        daemon_reload: true
        name: iop-cvemap-download.service
        state: restarted

# API runs from the controller (redhat.satellite collection); host_vars for the Satellite FQDN load org/location/url.
- name: Nested Lightspeed demo host group (child of rhel9-server)
  hosts: satellite_group
  connection: local
  gather_facts: false
  tags:
    - lightspeed_demo_hostgroup
  vars_files:
    - "~/vault/satellite.yml"
    - "~/vault/secrets.yml"
    - "{{ playbook_dir }}/laptop.lab.yml"
  vars:
    lightspeed_demo_configure_hostgroup: true
    lightspeed_demo_hostgroup_parent: "{{ rhel9_hostgroup_name | default('rhel9-server') }}"
    lightspeed_demo_hostgroup_name: lightspeed-demo
    lightspeed_demo_hostgroup_ansible_roles:
      - RedHatInsights.insights-client
      - lightspeed_demo_recommendation
      - lightspeed_demo_vulnerability

  pre_tasks:
    - name: Skip host group configuration when disabled
      when: not (lightspeed_demo_configure_hostgroup | default(true) | bool)
      ansible.builtin.meta: end_play

    - name: Stat optional repo-root CA for Satellite API (./ca.crt)
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/ca.crt"
      register: lightspeed_demo_ca_crt_stat

    - name: Default satellite_ca_path to repo ca.crt when file exists
      ansible.builtin.set_fact:
        satellite_ca_path: "{{ playbook_dir }}/ca.crt"
      when:
        - satellite_ca_path is not defined
        - lightspeed_demo_ca_crt_stat.stat.exists

  tasks:
    - name: Verify parent host group exists (create it with post-install tags_hostgroup first)
      redhat.satellite.resource_info:
        username: "{{ satellite_username | default('admin') }}"
        password: "{{ satellite_password }}"
        server_url: "{{ satellite_url }}"
        validate_certs: "{{ satellite_validate_certs | default(true) }}"
        ca_path: "{{ satellite_ca_path | default(omit) }}"
        resource: hostgroups
        search: 'name = "{{ lightspeed_demo_hostgroup_parent }}"'
      register: lightspeed_demo_parent_hg
      run_once: true

    - name: Require exactly one parent host group for search name
      ansible.builtin.assert:
        that:
          - lightspeed_demo_parent_hg.resources | default([]) | length == 1
        fail_msg: >-
          Expected one host group named [{{ lightspeed_demo_hostgroup_parent }}]; found {{ lightspeed_demo_parent_hg.resources | default([]) | length }}.
          Run post-install (rhel9_provisioning host group) or fix lightspeed_demo_hostgroup_parent.
      run_once: true

    - name: Optionally set lab_bootstrap_authorized_key from controller ~/.ssh/casmith.pub
      when: lab_bootstrap_authorized_key is not defined
      block:
        - name: Stat ~/.ssh/casmith.pub on the Ansible controller
          ansible.builtin.stat:
            path: "{{ (lookup('env', 'HOME') | default('/root', true)) ~ '/.ssh/casmith.pub' }}"
          register: lightspeed_casmith_pub_on_controller
        - name: Load one-line public key for Foreman host group parameter
          when: lightspeed_casmith_pub_on_controller.stat.exists
          ansible.builtin.set_fact:
            lab_bootstrap_authorized_key: "{{ lookup('file', (lookup('env', 'HOME') | default('/root', true)) ~ '/.ssh/casmith.pub') | trim }}"
      run_once: true

    - name: Build Foreman parameters list for SOE (password SSH + optional bootstrap key)
      ansible.builtin.set_fact:
        # network_zone=internal: kickstart sets NIC to firewalld "internal" zone (SSH allowed).
        # Without this, network_zone is nil; the ERB nil != '' bug caused --set-default-zone=drop to
        # run without a valid --zone= assignment, blocking SSH permanently (confirmed H1).
        _lightspeed_demo_hg_params: >-
          {{
            [
              {'name': 'lab_permit_root_password_ssh', 'parameter_type': 'boolean', 'value': true},
              {'name': 'network_zone', 'parameter_type': 'string', 'value': 'internal'}
            ]
            + (
              [{'name': 'lab_bootstrap_authorized_key', 'parameter_type': 'string', 'value': (lab_bootstrap_authorized_key | string)}]
              if (lab_bootstrap_authorized_key is defined and ((lab_bootstrap_authorized_key | string) | length > 0))
              else []
            )
          }}
      run_once: true

    - name: Ensure nested host group exists with Lightspeed demo Ansible roles
      redhat.satellite.hostgroup:
        username: "{{ satellite_username | default('admin') }}"
        password: "{{ satellite_password }}"
        server_url: "{{ satellite_url }}"
        validate_certs: "{{ satellite_validate_certs | default(true) }}"
        ca_path: "{{ satellite_ca_path | default(omit) }}"
        state: present
        organization: "{{ satellite_organization }}"
        parent: "{{ lightspeed_demo_hostgroup_parent }}"
        name: "{{ lightspeed_demo_hostgroup_name }}"
        locations:
          - "{{ satellite_location }}"
        description: >-
          Lab clone of {{ lightspeed_demo_hostgroup_parent }} for Lightspeed IOP recommendation + vulnerability demos.
        ansible_roles: "{{ lightspeed_demo_hostgroup_ansible_roles }}"
        # SOE kickstart %post: sshd (lab_permit_root_password_ssh) + root authorized_keys
        # (lab_bootstrap_authorized_key) — see prov_template_soe_kickstart_default.j2 %post --nochroot.
        parameters: "{{ _lightspeed_demo_hg_params }}"
      run_once: true
